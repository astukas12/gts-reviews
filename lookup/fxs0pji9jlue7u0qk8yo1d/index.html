<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Sweat Lookup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#121212;--panel:#1e1e1e;--fg:#fff;--mute:#999;--line:#404040;--accent:#FFE500;--good:#4caf50;--bad:#f44336;--chip:#2d2d2d;color-scheme:dark}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,Arial,sans-serif;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto}
header{padding:14px 0 10px;border-bottom:1px solid var(--line)}
h1{font:700 21px/1.1 Inter,sans-serif;margin:0;color:var(--accent)}.sub{color:var(--mute);font-size:12.5px;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:inherit;font-weight:600;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
button[aria-pressed=true]{background:var(--accent);color:#000;border-color:var(--accent)}
button.dim{opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}.tile .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;min-width:0}
h2{font:600 13.5px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;color:var(--accent)}
.card{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#181818;min-width:0}
.card>.hd{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline;padding:10px 12px;cursor:pointer}
.card>.hd:hover{background:rgba(255,229,0,.05)}
.card .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.card .m{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.card .bd{padding:0 12px 12px;display:none}.card.open>.bd{display:block}
.good{color:var(--good)}.bad{color:var(--bad)}.mute{color:var(--mute)}
.tw{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:right;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.n{text-align:left;white-space:normal}
.lu{white-space:normal;text-align:left;color:#ccc;font-size:12px;line-height:1.7}
.c{border:1px solid #FFE500;color:#FFE500;border-radius:999px;padding:0 6px;font-size:11px;margin-right:4px}
.chip{display:inline-block;background:#2a2a2a;border:1px solid #444;border-radius:999px;padding:1px 8px;margin:1px 2px 1px 0;font-size:11.5px;white-space:nowrap}
.note{color:var(--mute);font-size:12px;margin:8px 0 0}
.bar{display:inline-block;height:6px;background:var(--accent);border-radius:3px;vertical-align:middle}
.pos{color:var(--good)}.neg{color:var(--bad)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.ctl label{font-size:12px;color:var(--mute)}
</style></head><body><div class="wrap">
<header><h1>Sweat Lookup</h1><div class="sub" id="sub">Loading...</div></header>
<div class="row" id="users" role="group" aria-label="Username"></div>
<div class="row" id="sports" role="group" aria-label="Sport"></div>
<div id="msg" class="note"></div>
<div class="tiles" id="tiles"></div>
<section id="slsec" hidden><h2>Slates</h2>
 <div class="ctl"><label for="sort">Sort</label><select id="sort"><option value="date">Newest</option><option value="profit">Profit</option><option value="entries">Entries</option><option value="fees">Fees</option></select>
 <label for="gt">Type</label><select id="gt"><option value="all">All</option><option value="cl">Classic</option><option value="sd">Showdown</option></select></div>
 <div id="slates"></div></section>
</div>
<script>
"use strict";
var D=null, USER=null, SPORT=null, SORT="date", GT="all", OPEN={};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(x){var s=Math.abs(x)>=1000?Math.round(Math.abs(x)).toLocaleString():Math.abs(x).toFixed(2);return (x<0?"-$":"$")+s}
function cls(x){return x>0.004?"pos":x<-0.004?"neg":""}
function n0(x){return Math.round(x).toLocaleString()}
function slateStats(sl){var e=0,f=0,p=0,best=null;sl.contests.forEach(function(c){e+=c.e.length;f+=c.e.length*c.fee;c.e.forEach(function(r){p+=r[2]})});return{contests:sl.contests.length,entries:e,fees:f,prize:p,profit:p-f}}
function allStats(sp){var o={slates:0,contests:0,entries:0,fees:0,prize:0};sp.slates.forEach(function(s){var t=slateStats(s);o.slates++;o.contests+=t.contests;o.entries+=t.entries;o.fees+=t.fees;o.prize+=t.prize});o.profit=o.prize-o.fees;return o}
function userStats(u){var o={slates:0,contests:0,entries:0,fees:0,prize:0};Object.keys(u.sports).forEach(function(k){var t=allStats(u.sports[k]);for(var a in o)o[a]+=t[a]});o.profit=o.prize-o.fees;return o}
function selUsers(){return USER?D.users.filter(function(u){return u.user===USER}):D.users}
function sportsOf(users){var s={};users.forEach(function(u){Object.keys(u.sports).forEach(function(k){s[k]=1})});return Object.keys(s).sort()}
function tabs(){
 var h='<button data-u="" aria-pressed="'+(!USER)+'">All</button>';
 D.users.forEach(function(u){h+='<button data-u="'+esc(u.user)+'" aria-pressed="'+(USER===u.user)+'" class="'+(u.found?"":"dim")+'">'+esc(u.user)+(u.found?"":" (no data)")+'</button>'});
 $("users").innerHTML=h;
 var sp=sportsOf(selUsers());if(SPORT&&sp.indexOf(SPORT)<0)SPORT=null;
 var g='<button data-s="" aria-pressed="'+(!SPORT)+'">All sports</button>';
 sp.forEach(function(k){g+='<button data-s="'+k+'" aria-pressed="'+(SPORT===k)+'">'+k+'</button>'});
 $("sports").innerHTML=g;
}
function render(){
 tabs();var us=selUsers(),miss=D.users.filter(function(u){return !u.found}).map(function(u){return u.user});
 $("msg").innerHTML=miss.length?esc(miss.join(", "))+" "+(miss.length>1?"have":"has")+" no entries in the contest database (only contests filed through the review capture are in it).":"";
 var t={slates:0,contests:0,entries:0,fees:0,prize:0};
 us.forEach(function(u){Object.keys(u.sports).forEach(function(k){if(SPORT&&SPORT!==k)return;var a=allStats(u.sports[k]);for(var x in t)t[x]+=a[x]})});
 var prof=t.prize-t.fees;
 $("tiles").innerHTML=[["Sports",sportsOf(us).filter(function(k){return !SPORT||SPORT===k}).length],["Slates",n0(t.slates)],["Contests",n0(t.contests)],["Entries",n0(t.entries)],["Fees",money(t.fees)],["Prizes",money(t.prize)],["Profit",'<span class="'+cls(prof)+'">'+money(prof)+'</span>'],["ROI",t.fees?'<span class="'+cls(prof)+'">'+(100*prof/t.fees).toFixed(1)+'%</span>':"-"]].map(function(a){return '<div class="tile"><div class="k">'+a[0]+'</div><div class="v">'+a[1]+'</div></div>'}).join("");
 // slates list across selected users/sports
 var rows=[];us.forEach(function(u){Object.keys(u.sports).forEach(function(k){if(SPORT&&SPORT!==k)return;var sp=u.sports[k];sp.slates.forEach(function(s){if(GT==="cl"&&s.sd||GT==="sd"&&!s.sd)return;rows.push({u:u,sport:k,sp:sp,s:s,st:slateStats(s)})})})});
 rows.sort(function(a,b){return SORT==="profit"?b.st.profit-a.st.profit:SORT==="entries"?b.st.entries-a.st.entries:SORT==="fees"?b.st.fees-a.st.fees:(b.s.date<a.s.date?-1:b.s.date>a.s.date?1:0)});
 $("slsec").hidden=!rows.length;
 $("slates").innerHTML=rows.map(function(r,i){var k=r.u.user+"|"+r.sport+"|"+r.s.dg;var o=OPEN[k];
  return '<div class="card'+(o?" open":"")+'" data-k="'+esc(k)+'"><div class="hd" role="button" tabindex="0" data-i="'+i+'"><span class="t">'+(US()?"":'<span class="chip">'+esc(r.u.user)+'</span>')+(SPORT?"":'<span class="chip">'+r.sport+'</span>')+esc(r.s.date)+" · "+esc(r.s.label)+'</span><span class="m">'+r.st.contests+" contests · "+r.st.entries+" entries · "+money(r.st.fees)+' in · <span class="'+cls(r.st.profit)+'">'+money(r.st.profit)+'</span></span></div><div class="bd">'+(o?slateBody(r):"")+'</div></div>'}).join("");
 ROWS=rows;
}
var ROWS=[];
function US(){return !!USER}
function expo(r,cs,own,fieldN,what){
 var pl=r.sp.players,cnt={},n=0,hasLU=0;
 cs.forEach(function(c){c.e.forEach(function(e){n++;if(e[4].length)hasLU++;e[4].forEach(function(t){var k=t<0?"c"+(-t):""+t;cnt[k]=(cnt[k]||0)+1})})});
 var ks=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]});
 var rows=ks.map(function(t){var mine=100*cnt[t]/Math.max(1,hasLU),f=own[t]==null?0:own[t];var cp=t.charAt(0)==="c";var id=cp?t.slice(1):t;return{n:(cp?'<span class="c">CPT</span>':"")+esc(pl[+id-1]),mine:mine,f:f,lev:mine-f}});
 var h='<div class="note" style="margin:0 0 6px">His % = share of his '+hasLU+' lineups with the player. Field % = share of '+(what==="contest"?"this contest's":"all captured")+' entries ('+n0(fieldN)+'). Lev = his minus field.</div><div class="tw"><table><thead><tr><th>Player</th><th>His %</th><th></th><th>Field %</th><th>Lev</th></tr></thead><tbody>';
 h+=rows.slice(0,60).map(function(x){return'<tr><td class="n">'+x.n+'</td><td>'+x.mine.toFixed(1)+'</td><td style="min-width:54px"><span class="bar" style="width:'+Math.min(50,x.mine/2)+'px"></span></td><td>'+x.f.toFixed(1)+'</td><td class="'+cls(x.lev)+'">'+(x.lev>0?"+":"")+x.lev.toFixed(1)+'</td></tr>'}).join("");
 return h+'</tbody></table></div>'+(rows.length>60?'<div class="note">Top 60 of '+rows.length+' players.</div>':"");
}
function slateBody(r){
 var h='<h2 style="margin-top:10px">Slate exposures</h2>'+expo(r,r.s.contests,r.s.own,r.s.fieldN,"slate")+'<h2 style="margin-top:14px">Contests</h2>';
 var cs=r.s.contests.slice().sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:b.fee-a.fee});
 cs.forEach(function(c){var k=r.u.user+"|"+r.sport+"|"+r.s.dg+"|"+c.id;var pz=0;c.e.forEach(function(e){pz+=e[2]});var best=c.e.reduce(function(m,e){return Math.min(m,e[0])},1e9);var pr=pz-c.e.length*c.fee;
  h+='<div class="card'+(OPEN[k]?" open":"")+'" data-ck="'+esc(k)+'"><div class="hd" role="button" tabindex="0" data-c="1"><span class="t">'+esc(c.name)+'</span><span class="m">'+c.e.length+'x '+money(c.fee)+' · field '+n0(c.size)+' · best #'+n0(best)+' · <span class="'+cls(pr)+'">'+money(pr)+'</span></span></div><div class="bd">'+(OPEN[k]?contestBody(r,c):"")+'</div></div>'});
 return h;
}
function lineup(pl,ids,sd){return ids.map(function(t,i){var cp=t<0;var id=cp?-t:t;return(cp?'<span class="c">CPT</span>':"")+esc(pl[+id-1])}).join(" · ")}
function contestBody(r,c){
 var pl=r.sp.players,es=c.e.slice().sort(function(a,b){return a[0]-b[0]});
 var h='<div class="note" style="margin:0 0 8px"><a href="https://www.draftkings.com/contest/gamecenter/'+esc(c.id)+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:600">Open on DraftKings &#8599;</a> · '+esc(c.group)+' · '+esc(c.structure)+' · prize pool '+money(c.prize_pool)+' · starts '+esc(c.start)+' UTC'+(c.win!=null?' · winning score '+c.win:'')+(c.cash!=null?' · cash line '+c.cash:'')+(c.max!=null?' · max '+c.max+' entries':'')+'</div>'+(c.fieldN?'<h2 style="margin-top:6px">Exposure in this contest</h2>'+expo(r,[c],c.own||{},c.fieldN,"contest"):'')+'<h2 style="margin-top:12px">Entries</h2><div class="tw"><table><thead><tr><th>Rank</th><th>Pts</th><th>Prize</th><th>Dupes</th><th style="text-align:left">Lineup</th></tr></thead><tbody>';
 h+=es.slice(0,400).map(function(e){return'<tr><td>'+n0(e[0])+'</td><td>'+e[1]+'</td><td class="'+(e[2]>0?"pos":"")+'">'+(e[2]>0?money(e[2]):"-")+'</td><td>'+(e[3]||'-')+'</td><td class="lu">'+(e[4].length?lineup(pl,e[4]):'<span class="mute">no lineup in standings</span>')+'</td></tr>'}).join("");
 return h+'</tbody></table></div>'+(es.length>400?'<div class="note">Showing best 400 of '+es.length+' entries.</div>':"")+'<div class="note">Final standings only. Live and unfinished contests are not in the contest database yet, so there is no rooting guide.</div>';
}
document.addEventListener("click",function(ev){
 var b=ev.target.closest&&ev.target.closest("button[data-u],button[data-s]");
 if(b){if(b.hasAttribute("data-u"))USER=b.getAttribute("data-u")||null;else SPORT=b.getAttribute("data-s")||null;render();return}
 var hd=ev.target.closest&&ev.target.closest(".hd");if(!hd)return;
 var card=hd.parentNode;
 if(hd.hasAttribute("data-c")){var ck=card.getAttribute("data-ck");OPEN[ck]=!OPEN[ck];var parts=ck.split("|");var sk=parts.slice(0,3).join("|");var r=ROWS.filter(function(x){return x.u.user+"|"+x.sport+"|"+x.s.dg===sk})[0];var c=r.s.contests.filter(function(x){return x.id===parts[3]})[0];card.classList.toggle("open",!!OPEN[ck]);card.querySelector(".bd").innerHTML=OPEN[ck]?contestBody(r,c):"";return}
 var k=card.getAttribute("data-k");OPEN[k]=!OPEN[k];var r2=ROWS[+hd.getAttribute("data-i")];card.classList.toggle("open",!!OPEN[k]);card.querySelector(".bd").innerHTML=OPEN[k]?slateBody(r2):"";
});
document.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList&&ev.target.classList.contains("hd")){ev.preventDefault();ev.target.click()}});
$("sort").onchange=function(){SORT=this.value;render()};$("gt").onchange=function(){GT=this.value;render()};
fetch("data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
 D=d;$("sub").textContent="Final standings from the GTS contest database · built "+d.built+" · private page";render();
}).catch(function(e){$("sub").textContent="Could not load data ("+e.message+")"});
</script></body></html>
