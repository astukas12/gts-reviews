<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Sweat Lookup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#121212;--panel:#1e1e1e;--fg:#fff;--mute:#999;--line:#404040;--accent:#FFE500;--good:#4caf50;--bad:#f44336;--chip:#2d2d2d;color-scheme:dark}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,Arial,sans-serif;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto}
header{padding:14px 0 10px;border-bottom:1px solid var(--line)}
h1{font:700 21px/1.1 Inter,sans-serif;margin:0;color:var(--accent)}.sub{color:var(--mute);font-size:12.5px;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:inherit;font-weight:600;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
button[aria-pressed=true]{background:var(--accent);color:#000;border-color:var(--accent)}
button.dim{opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}.tile .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;min-width:0}
h2{font:600 13.5px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;color:var(--accent)}
.card{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#181818;min-width:0}
.card>.hd{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline;padding:10px 12px;cursor:pointer}
.card>.hd:hover{background:rgba(255,229,0,.05)}
.card .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.card .m{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.card .bd{padding:0 12px 12px;display:none}.card.open>.bd{display:block}
.good{color:var(--good)}.bad{color:var(--bad)}.mute{color:var(--mute)}
.tw{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:right;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.n{text-align:left;white-space:normal}
.lu{white-space:normal;text-align:left;color:#ccc;font-size:12px;line-height:1.7}
.c{border:1px solid #FFE500;color:#FFE500;border-radius:999px;padding:0 6px;font-size:11px;margin-right:4px}
.chip{display:inline-block;background:#2a2a2a;border:1px solid #444;border-radius:999px;padding:1px 8px;margin:1px 2px 1px 0;font-size:11.5px;white-space:nowrap}
.note{color:var(--mute);font-size:12px;margin:8px 0 0}
.bar{display:inline-block;height:6px;background:var(--accent);border-radius:3px;vertical-align:middle}
.pos{color:var(--good)}.neg{color:var(--bad)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.ctl label{font-size:12px;color:var(--mute)}

/* ---- visual pass ---- */
[hidden]{display:none!important}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #2a2a2a}.kv>span:last-child{text-align:right}
.sum .big{line-height:1.15}.sum .big span{line-height:1.2}
#bar{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:6px 16px 4px;border-bottom:1px solid var(--line)}
#bar .row{margin:6px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#bar .row::-webkit-scrollbar{display:none}
#bar .row button{flex:0 0 auto}
button{min-height:40px;padding:8px 14px}
#fresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin:4px 0}
.dot{width:9px;height:9px;border-radius:50%;background:#777;display:inline-block}
.dot.g{background:var(--good);box-shadow:0 0 8px rgba(76,175,80,.6)}.dot.a{background:#ff9800}.dot.r{background:var(--bad)}
.card>.hd{padding:13px 12px;min-height:48px}
.card>.hd .t{flex:1 1 100%}.card>.hd .m{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:2px 10px}
details{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:#161616}
details>summary{cursor:pointer;padding:12px;font-weight:600;color:var(--accent);min-height:44px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";color:var(--mute);font-weight:700}
details[open]>summary::after{content:"\2212"}
details>*:not(summary){margin-left:10px;margin-right:10px}details>*:last-child{margin-bottom:10px}
h3{font:600 12.5px/1.2 Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:12px 0 4px}
.xr,.rr{padding:8px 0;border-bottom:1px solid #2a2a2a}
.xtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.xn{font-weight:600;min-width:0;overflow-wrap:anywhere}.xnum{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.xsub{color:var(--mute);font-size:11.5px;margin-top:1px}
.xb{position:relative;height:7px;background:#2a2a2a;border-radius:4px;margin-top:5px;overflow:visible}
.xbar{display:block;height:7px;background:var(--accent);border-radius:4px}
.xtick{position:absolute;top:-3px;width:2px;height:13px;background:#fff;border-radius:1px}
.lev{display:inline-block;min-width:38px;text-align:center;border-radius:999px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:6px}
.lv0{background:#2a2a2a;color:#bbb}.lv2{background:rgba(76,175,80,.18);color:#8bd68e}.lv3{background:rgba(76,175,80,.4);color:#c9f5cb}
.lm2{background:rgba(244,67,54,.18);color:#f0908a}.lm3{background:rgba(244,67,54,.4);color:#ffd0cc}
.itm{background:rgba(76,175,80,.25);color:#b8efba;border-radius:999px;padding:0 8px;font-weight:700;font-size:12px}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.flt button{padding:6px 12px;min-height:36px;font-size:13px}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:6px 0}
@media (min-width:700px){.sum{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="wrap">
<header><h1>Sweat Lookup</h1><div class="sub" id="sub">Loading...</div></header>
<div id="bar"><div class="row" id="views" role="group" aria-label="View"><button data-v="today" aria-pressed="true">Today (live)</button><button data-v="hist" aria-pressed="false">History</button></div>
<div class="row" id="users" role="group" aria-label="Username"></div>
<div class="row" id="sports" role="group" aria-label="Sport"></div><div id="fresh"></div></div>
<div id="msg" class="note"></div>
<div id="today"></div>
<div id="hist" hidden>
<div class="tiles" id="tiles"></div>
<section id="slsec" hidden><h2>Slates</h2>
 <div class="ctl"><label for="sort">Sort</label><select id="sort"><option value="date">Newest</option><option value="profit">Profit</option><option value="entries">Entries</option><option value="fees">Fees</option></select>
 <label for="gt">Type</label><select id="gt"><option value="all">All</option><option value="cl">Classic</option><option value="sd">Showdown</option></select></div>
 <div id="slates"></div></section>
</div>
</div>
<script>
"use strict";
var D=null, USER=null, SPORT=null, SORT="date", GT="all", OPEN={};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(x){var s=Math.abs(x)>=1000?Math.round(Math.abs(x)).toLocaleString():Math.abs(x).toFixed(2);return (x<0?"-$":"$")+s}
function cls(x){return x>0.004?"pos":x<-0.004?"neg":""}
function n0(x){return Math.round(x).toLocaleString()}
function slateStats(sl){var e=0,f=0,p=0,best=null;sl.contests.forEach(function(c){e+=c.e.length;f+=c.e.length*c.fee;c.e.forEach(function(r){p+=r[2]})});return{contests:sl.contests.length,entries:e,fees:f,prize:p,profit:p-f}}
function allStats(sp){var o={slates:0,contests:0,entries:0,fees:0,prize:0};sp.slates.forEach(function(s){var t=slateStats(s);o.slates++;o.contests+=t.contests;o.entries+=t.entries;o.fees+=t.fees;o.prize+=t.prize});o.profit=o.prize-o.fees;return o}
function userStats(u){var o={slates:0,contests:0,entries:0,fees:0,prize:0};Object.keys(u.sports).forEach(function(k){var t=allStats(u.sports[k]);for(var a in o)o[a]+=t[a]});o.profit=o.prize-o.fees;return o}
function selUsers(){return USER?D.users.filter(function(u){return u.user===USER}):D.users}
function sportsOf(users){var s={};users.forEach(function(u){Object.keys(u.sports).forEach(function(k){s[k]=1})});return Object.keys(s).sort()}
function tabs(){
 var h='<button data-u="" aria-pressed="'+(!USER)+'">All</button>';
 D.users.forEach(function(u){h+='<button data-u="'+esc(u.user)+'" aria-pressed="'+(USER===u.user)+'" class="'+(u.found?"":"dim")+'">'+esc(u.user)+(u.found?"":" (no data)")+'</button>'});
 $("users").innerHTML=h;
 var sp=sportsOf(selUsers());if(SPORT&&sp.indexOf(SPORT)<0)SPORT=null;
 var g='<button data-s="" aria-pressed="'+(!SPORT)+'">All sports</button>';
 sp.forEach(function(k){g+='<button data-s="'+k+'" aria-pressed="'+(SPORT===k)+'">'+k+'</button>'});
 $("sports").innerHTML=g;
}
function render(){
 tabs();var us=selUsers(),miss=D.users.filter(function(u){return !u.found}).map(function(u){return u.user});
 $("msg").innerHTML=miss.length?esc(miss.join(", "))+" "+(miss.length>1?"have":"has")+" no entries in the contest database (only contests filed through the review capture are in it).":"";
 var t={slates:0,contests:0,entries:0,fees:0,prize:0};
 us.forEach(function(u){Object.keys(u.sports).forEach(function(k){if(SPORT&&SPORT!==k)return;var a=allStats(u.sports[k]);for(var x in t)t[x]+=a[x]})});
 var prof=t.prize-t.fees;
 $("tiles").innerHTML=[["Sports",sportsOf(us).filter(function(k){return !SPORT||SPORT===k}).length],["Slates",n0(t.slates)],["Contests",n0(t.contests)],["Entries",n0(t.entries)],["Fees",money(t.fees)],["Prizes",money(t.prize)],["Profit",'<span class="'+cls(prof)+'">'+money(prof)+'</span>'],["ROI",t.fees?'<span class="'+cls(prof)+'">'+(100*prof/t.fees).toFixed(1)+'%</span>':"-"]].map(function(a){return '<div class="tile"><div class="k">'+a[0]+'</div><div class="v">'+a[1]+'</div></div>'}).join("");
 // slates list across selected users/sports
 var rows=[];us.forEach(function(u){Object.keys(u.sports).forEach(function(k){if(SPORT&&SPORT!==k)return;var sp=u.sports[k];sp.slates.forEach(function(s){if(GT==="cl"&&s.sd||GT==="sd"&&!s.sd)return;rows.push({u:u,sport:k,sp:sp,s:s,st:slateStats(s)})})})});
 rows.sort(function(a,b){return SORT==="profit"?b.st.profit-a.st.profit:SORT==="entries"?b.st.entries-a.st.entries:SORT==="fees"?b.st.fees-a.st.fees:(b.s.date<a.s.date?-1:b.s.date>a.s.date?1:0)});
 $("slsec").hidden=!rows.length;
 $("slates").innerHTML=rows.map(function(r,i){var k=r.u.user+"|"+r.sport+"|"+r.s.dg;var o=OPEN[k];
  return '<div class="card'+(o?" open":"")+'" data-k="'+esc(k)+'"><div class="hd" role="button" tabindex="0" data-i="'+i+'"><span class="t">'+(US()?"":'<span class="chip">'+esc(r.u.user)+'</span>')+(SPORT?"":'<span class="chip">'+r.sport+'</span>')+esc(r.s.date)+" · "+esc(r.s.label)+'</span><span class="m">'+r.st.contests+" contests · "+r.st.entries+" entries · "+money(r.st.fees)+' in · <span class="'+cls(r.st.profit)+'">'+money(r.st.profit)+'</span></span></div><div class="bd">'+(o?slateBody(r):"")+'</div></div>'}).join("");
 ROWS=rows;
}
var ROWS=[];
function US(){return !!USER}
function expo(r,cs,own,fieldN,what){
 var pl=r.sp.players,cnt={},n=0,hasLU=0;
 cs.forEach(function(c){c.e.forEach(function(e){n++;if(e[4].length)hasLU++;e[4].forEach(function(t){var k=t<0?"c"+(-t):""+t;cnt[k]=(cnt[k]||0)+1})})});
 var ks=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]});
 var h='<div class="note" style="margin:0 0 6px">Gold bar = his share of his '+hasLU+' lineups; white tick = field share ('+n0(fieldN)+' entries'+(what==="contest"?" in this contest":" across the slate")+'). The pill is his minus field.</div>';
 h+=ks.slice(0,40).map(function(t){var mine=100*cnt[t]/Math.max(1,hasLU),f=own[t]==null?0:own[t],cp=t.charAt(0)==="c",id=cp?t.slice(1):t;return xrow((cp?'<span class="c">CPT</span>':"")+esc(pl[+id-1]),"",mine,f,"")}).join("");
 return h+(ks.length>40?'<div class="note">Top 40 of '+ks.length+' players.</div>':"");
}
function slateBody(r){
 var h='<h2 style="margin-top:10px">Slate exposures</h2>'+expo(r,r.s.contests,r.s.own,r.s.fieldN,"slate")+'<h2 style="margin-top:14px">Contests</h2>';
 var cs=r.s.contests.slice().sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:b.fee-a.fee});
 cs.forEach(function(c){var k=r.u.user+"|"+r.sport+"|"+r.s.dg+"|"+c.id;var pz=0;c.e.forEach(function(e){pz+=e[2]});var best=c.e.reduce(function(m,e){return Math.min(m,e[0])},1e9);var pr=pz-c.e.length*c.fee;
  h+='<div class="card'+(OPEN[k]?" open":"")+'" data-ck="'+esc(k)+'"><div class="hd" role="button" tabindex="0" data-c="1"><span class="t">'+esc(c.name)+'</span><span class="m">'+c.e.length+'x '+money(c.fee)+' · field '+n0(c.size)+' · best #'+n0(best)+' · <span class="'+cls(pr)+'">'+money(pr)+'</span></span></div><div class="bd">'+(OPEN[k]?contestBody(r,c):"")+'</div></div>'});
 return h;
}
function lineup(pl,ids,sd){return ids.map(function(t,i){var cp=t<0;var id=cp?-t:t;return(cp?'<span class="c">CPT</span>':"")+esc(pl[+id-1])}).join(" · ")}
function contestBody(r,c){
 var pl=r.sp.players,es=c.e.slice().sort(function(a,b){return a[0]-b[0]});
 var h='<div class="note" style="margin:0 0 8px"><a href="https://www.draftkings.com/contest/gamecenter/'+esc(c.id)+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:600">Open on DraftKings &#8599;</a> · '+esc(c.group)+' · '+esc(c.structure)+' · prize pool '+money(c.prize_pool)+' · starts '+esc(c.start)+' UTC'+(c.win!=null?' · winning score '+c.win:'')+(c.cash!=null?' · cash line '+c.cash:'')+(c.max!=null?' · max '+c.max+' entries':'')+'</div>'+(c.fieldN?'<h2 style="margin-top:6px">Exposure in this contest</h2>'+expo(r,[c],c.own||{},c.fieldN,"contest"):'')+'<h2 style="margin-top:12px">Entries</h2><div class="tw"><table><thead><tr><th>Rank</th><th>Pts</th><th>Prize</th><th>Dupes</th><th style="text-align:left">Lineup</th></tr></thead><tbody>';
 h+=es.slice(0,400).map(function(e){return'<tr><td>'+n0(e[0])+'</td><td>'+e[1]+'</td><td class="'+(e[2]>0?"pos":"")+'">'+(e[2]>0?money(e[2]):"-")+'</td><td>'+(e[3]||'-')+'</td><td class="lu">'+(e[4].length?lineup(pl,e[4]):'<span class="mute">no lineup in standings</span>')+'</td></tr>'}).join("");
 return h+'</tbody></table></div>'+(es.length>400?'<div class="note">Showing best 400 of '+es.length+' entries.</div>':"")+'<div class="note">Final standings only. Live and unfinished contests are not in the contest database yet, so there is no rooting guide.</div>';
}
document.addEventListener("click",function(ev){
 var b=ev.target.closest&&ev.target.closest("button[data-u],button[data-s]");
 if(b){if(b.hasAttribute("data-u"))USER=b.getAttribute("data-u")||null;else SPORT=b.getAttribute("data-s")||null;if(VIEW==="today"){tabs();renderToday()}else render();return}
 var hd=ev.target.closest&&ev.target.closest(".hd");if(!hd)return;
 var card=hd.parentNode;
 if(hd.hasAttribute("data-c")){var ck=card.getAttribute("data-ck");OPEN[ck]=!OPEN[ck];var parts=ck.split("|");var sk=parts.slice(0,3).join("|");var r=ROWS.filter(function(x){return x.u.user+"|"+x.sport+"|"+x.s.dg===sk})[0];var c=r.s.contests.filter(function(x){return x.id===parts[3]})[0];card.classList.toggle("open",!!OPEN[ck]);card.querySelector(".bd").innerHTML=OPEN[ck]?contestBody(r,c):"";return}
 var k=card.getAttribute("data-k");OPEN[k]=!OPEN[k];var r2=ROWS[+hd.getAttribute("data-i")];card.classList.toggle("open",!!OPEN[k]);card.querySelector(".bd").innerHTML=OPEN[k]?slateBody(r2):"";
});
document.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList&&ev.target.classList.contains("hd")){ev.preventDefault();ev.target.click()}});
$("sort").onchange=function(){SORT=this.value;render()};$("gt").onchange=function(){GT=this.value;render()};

var VIEW="today", T=null, TOPEN={};
function hid(v){return v==="locked"||v==="LOCKED"}
function det(title,body,open){return '<details'+(open?' open':'')+'><summary>'+title+'</summary>'+body+'</details>'}
function levPill(l){var c=l>=15?"lv3":l>=5?"lv2":l<=-15?"lm3":l<=-5?"lm2":"lv0";return '<span class="lev '+c+'">'+(l>0?"+":"")+l.toFixed(0)+'</span>'}
function xrow(name,sub,mine,fo,extra){return '<div class="xr"><div class="xtop"><span class="xn">'+name+'</span><span class="xnum"><b>'+mine.toFixed(0)+'%</b> <span class="mute">vs '+fo.toFixed(0)+'%</span>'+levPill(mine-fo)+'</span></div>'+(sub||extra?'<div class="xsub">'+(sub||"")+(extra?' · '+extra:"")+'</div>':"")+'<div class="xb"><span class="xbar" style="width:'+Math.min(100,mine)+'%"></span><span class="xtick" style="left:'+Math.min(99,fo)+'%"></span></div></div>'}
function fresh(){
 var el=$("fresh");if(!el)return;if(!T||VIEW!=="today"){el.innerHTML=D?'<span class="mute">History built '+esc(D.built)+'</span>':"";return}
 var m=(Date.now()-Date.parse(T.built.replace(" ","T")+"Z"))/60000,live=T.games&&T.games.some(function(g){return g[1]==="in"});
 var c=!live?"":m<6?"g":m<15?"a":"r";
 el.innerHTML='<span class="dot '+c+'"></span><span>Live data '+(m<1?"just now":Math.round(m)+" min ago")+(c==="r"?' &middot; <b class="bad">stale: the feed may be down</b>':c==="a"?' &middot; <span style="color:#ff9800">slow</span>':'')+(live?'':' &middot; no games in progress')+'</span>';
}
setInterval(fresh,20000);
function userSummary(){
 var us=(USER?[USER.toLowerCase()]:T.users.map(function(x){return x.toLowerCase()})),rows=[];
 us.forEach(function(u){var ct=0,en=0,itm=0,fees=0,best=null,bestc="";
  T.contests.forEach(function(c){var e=c.entries[u];if(!e)return;ct++;en+=e.length;fees+=e.length*(c.fee||0);var L=c.lines;e.forEach(function(x){if(L&&L.paid!=null&&x[0]<=L.paid)itm++;if(best==null||x[0]<best){best=x[0];bestc=c.name}})});
  if(!ct)return;
  rows.push('<div class="tile"><div class="k">'+esc(u)+'</div><div class="big '+(itm?"good":"")+'">'+n0(itm)+' <span class="mute" style="font-size:12px;font-weight:400">of '+n0(en)+' in the money</span></div><div class="note" style="margin:2px 0 0">'+ct+' contests &middot; '+money(fees)+' in &middot; best #'+n0(best)+'</div></div>')});
 return rows.length?'<div class="sum">'+rows.join("")+'</div>':"";
}
var CF="all";
function rootBlock(rk,u){
 if(!rk.length)return '<section><h2>Who to root for</h2><div class="note">Nothing left to root for, or no lineups visible yet (DK hides players until their game starts).</div></section>';
 var mx=rk[0][1]||1;
 function row(r){return '<div class="rr"><div class="rtop"><span class="xn">'+esc(r[0])+' <span class="mute" style="font-weight:400">'+esc(r[9]||"")+' '+esc(r[4]||"")+'</span></span><span class="xnum"><b>'+r[1]+'</b> lineups'+(r[3]?' &middot; '+r[3]+' CPT':'')+'</span></div><div class="xsub">'+esc(r[5])+' &middot; '+esc(r[7])+(r[8]!=null?' &middot; '+r[8]+' pts now':'')+(r[10]!=null?' &middot; proj '+r[10]:'')+'</div><div class="xb"><span class="xbar" style="width:'+(100*r[1]/mx)+'%"></span></div></div>'}
 return '<section><h2>Who to root for'+(u?' &middot; '+esc(USER):'')+'</h2><div class="note" style="margin:0 0 6px">Players still playing, by how many of his lineups hold them. DK hides players until their game starts.</div>'+rk.slice(0,10).map(row).join("")+(rk.length>10?det("Show "+(Math.min(rk.length,60)-10)+" more",rk.slice(10,60).map(row).join(""),false):"")+'</section>';
}
function renderToday(){
 var el=$("today");fresh();
 if(!T){el.innerHTML='<section><h2>Today</h2><div class="note">No live data yet. The live feed runs while games are on.</div></section>';return}
 var u=USER?USER.toLowerCase():null;
 var cs=T.contests.filter(function(c){return !u||c.entries[u]});
 var ne=0,nf=0;cs.forEach(function(c){Object.keys(c.entries).forEach(function(k){if(u&&k!==u)return;ne+=c.entries[k].length;nf+=c.entries[k].length*(c.fee||0)})});
 var h=userSummary();
 var rk=T.roots[u||"*"]||[];
 h+=rootBlock(rk,u);
 var gm={};rk.forEach(function(r){var g=r[5]||"?";gm[g]=gm[g]||{st:r[7],n:0,pl:0,pj:0};gm[g].n+=r[1];gm[g].pl++;gm[g].pj+=(r[1]+0.5*(r[3]||0))*(r[10]||0)});var gk=Object.keys(gm).sort(function(a,b){return gm[b].n-gm[a].n});
 if(gk.length)h+=det("Rooting by game ("+gk.length+")",'<div class="tw"><table><thead><tr><th>Game</th><th>Status</th><th>Slots</th><th>Proj left</th></tr></thead><tbody>'+gk.map(function(g){return '<tr><td class="n">'+esc(g)+'</td><td class="n">'+esc(gm[g].st)+'</td><td>'+gm[g].n+'</td><td>'+(ne?(gm[g].pj/ne).toFixed(1):"-")+'</td></tr>'}).join("")+'</tbody></table></div>',false);
 h+=det("Games",(T.games.length?T.games.map(function(g){var c=g[1]==="in"?"good":g[1]==="post"?"mute":"";return '<span class="chip"><b>'+esc(g[0])+'</b> <span class="'+c+'">'+esc(g[2])+'</span></span>'}).join(" "):'<span class="mute">no scoreboard</span>'),false);
 // contests: compact, in-the-money first
 var list=cs.map(function(c){var us=Object.keys(c.entries).filter(function(k){return !u||k===u});var all=[];us.forEach(function(k){c.entries[k].forEach(function(e){all.push({u:k,e:e})})});
  var itm=c.lines&&c.lines.paid!=null?all.filter(function(x){return x.e[0]<=c.lines.paid}).length:0;var best=all.reduce(function(m,x){return Math.min(m,x.e[0])},1e9);return{c:c,us:us,all:all,itm:itm,best:best}});
 var cnt={all:list.length,itm:list.filter(function(x){return x.itm>0}).length,sd:list.filter(function(x){return x.c.gt==="showdown"}).length,cl:list.filter(function(x){return x.c.gt!=="showdown"}).length};
 var shown=list.filter(function(x){return CF==="all"||(CF==="itm"&&x.itm>0)||(CF==="sd"&&x.c.gt==="showdown")||(CF==="cl"&&x.c.gt!=="showdown")});
 shown.sort(function(a,b){return (b.itm>0)-(a.itm>0)||b.c.fee*b.all.length-a.c.fee*a.all.length});
 h+='<section><h2>Live contests ('+ne+' entries, '+money(nf)+')</h2><div class="flt">'+[["all","All"],["itm","In the money"],["sd","Showdown"],["cl","Classic"]].map(function(f){return '<button data-cf="'+f[0]+'" aria-pressed="'+(CF===f[0])+'">'+f[1]+' '+cnt[f[0]]+'</button>'}).join("")+'</div>';
 if(!cs.length)h+='<div class="note">None of the scanned contests hold '+(u?esc(USER):'these users')+' yet. The scan widens every few minutes.</div>';
 shown.forEach(function(x){var c=x.c,k=c.id;
  h+='<div class="card'+(TOPEN[k]?" open":"")+'" data-tk="'+esc(k)+'"><div class="hd" role="button" tabindex="0"><span class="t">'+(u?"":x.us.map(function(z){return '<span class="chip">'+esc(z)+'</span>'}).join(""))+esc(c.name)+'</span><span class="m"><span>'+x.all.length+'x '+money(c.fee||0)+'</span><span>field '+n0(c.size)+'</span><span>best #'+n0(x.best)+'</span>'+(x.itm?'<span class="itm">'+x.itm+' ITM</span>':'')+'</span></div><div class="bd">'+(TOPEN[k]?todayBody(c,x.all):"")+'</div></div>'});
 el.innerHTML=h+'</section>';
}
function infoOf(c,p){var i=c.info&&c.info[p];return i?{tm:i[0],pos:i[1],sal:i[2],proj:i[3],pown:i[4],game:i[5],st:i[6]}:{tm:"",pos:"",sal:null,proj:null,pown:null,game:"",st:""}}
function rollups(c,lus,sd){
 var N=lus.length||1,team={},game={},stk={qb0:0,qb1:0,qb2:0,qb3:0,bb:0},pos={};
 lus.forEach(function(lu){var tc={},gc={},qb=null,pc={},opp=null;
  lu.forEach(function(p,i){if(hid(p))return;var f=infoOf(c,p);if(f.tm){tc[f.tm]=(tc[f.tm]||0)+1}if(f.game){gc[f.game]=(gc[f.game]||0)+1}if(f.pos){pos[f.pos]=(pos[f.pos]||0)+1}if(f.pos==="QB")qb=f});
  Object.keys(tc).forEach(function(t){team[t]=team[t]||{n:0,pl:0};team[t].n++;team[t].pl+=tc[t]});
  Object.keys(gc).forEach(function(g){game[g]=game[g]||{n:0,pl:0};game[g].n++;game[g].pl+=gc[g]});
  if(qb){var mates=0,bb=0;lu.forEach(function(p){if(hid(p))return;var f=infoOf(c,p);if(f.pos==="QB")return;if(f.tm===qb.tm&&(f.pos==="WR"||f.pos==="TE"))mates++;else if(f.tm!==qb.tm&&qb.game&&f.game===qb.game&&(f.pos==="WR"||f.pos==="TE"||f.pos==="RB"))bb++});stk[mates>=3?"qb3":mates===2?"qb2":mates===1?"qb1":"qb0"]++;if(bb>0&&mates>0)stk.bb++}});
 function tbl(o,h1){var ks=Object.keys(o).sort(function(a,b){return o[b].n-o[a].n});return '<div class="tw"><table><thead><tr><th>'+h1+'</th><th>Lineups</th><th>%</th><th>Avg players</th></tr></thead><tbody>'+ks.slice(0,40).map(function(k){return '<tr><td class="n">'+esc(k)+'</td><td>'+o[k].n+'</td><td>'+(100*o[k].n/N).toFixed(1)+'</td><td>'+(o[k].pl/o[k].n).toFixed(1)+'</td></tr>'}).join("")+'</tbody></table></div>'}
 var h='<h2 style="margin-top:12px">By team</h2>'+tbl(team,"Team")+'<h2 style="margin-top:12px">By game</h2>'+tbl(game,"Game");
 if(!sd&&(stk.qb0+stk.qb1+stk.qb2+stk.qb3)){h+='<h2 style="margin-top:12px">QB stacks</h2><div class="tw"><table><thead><tr><th>Stack</th><th>Lineups</th><th>%</th></tr></thead><tbody>'+[["QB naked",stk.qb0],["QB + 1 (WR/TE)",stk.qb1],["QB + 2",stk.qb2],["QB + 3 or more",stk.qb3],["with a bring-back",stk.bb]].map(function(r){return '<tr><td class="n">'+r[0]+'</td><td>'+r[1]+'</td><td>'+(100*r[1]/N).toFixed(1)+'</td></tr>'}).join("")+'</tbody></table></div>'}
 return h;
}
function prizeAt(L,rank){if(!L||!L.pay)return null;for(var i=0;i<L.pay.length;i++){var b=L.pay[i];if(rank>=b[0]&&rank<=b[1])return b[2]}return 0}
function kv(l,v,sub){return '<div class="kv"><span>'+l+'</span><span><b>'+v+'</b>'+(sub?'<br><span class="mute" style="font-size:11.5px">'+sub+'</span>':'')+'</span></div>'}
function linesBlock(c,all){
 var L=c.lines;if(!L)return '<div class="note">Payout lines appear after the next refresh.</div>';
 var h='<h3>Payout lines and who is ahead</h3>';
 h+=kv('Cash line',L.cash!=null?L.cash+' pts':'-',L.paid!=null?'top '+n0(L.paid)+' of '+n0(c.size)+' paid':'');
 h+=kv('Top 10%',L.t10!=null?L.t10+' pts':'-','rank '+n0(L.t10r||0))+kv('Top 1%',L.t1!=null?L.t1+' pts':'-','rank '+n0(L.t1r||0));
 (L.lead||[]).forEach(function(d,i){h+=kv((i?'#'+d.r+' ':'Leader ')+esc(d.u),d.p+' pts','')});
 if(L.lead&&L.lead[0]&&L.lead[0].lu)h+='<div class="note" style="margin:6px 0 0">Leader lineup: '+esc(L.lead[0].lu.replace(/LOCKED/g,"hidden"))+'</div>';
 var mine=all.reduce(function(m,x){return x.e[1]>m?x.e[1]:m},0);
 var itm=all.filter(function(x){return L.paid!=null&&x.e[0]<=L.paid}).length;
 h+='<div class="note" style="margin:6px 0 8px">'+(L.paid!=null?'<b>'+itm+'</b> of his '+all.length+' entries are in the money now. ':'')+(L.cash!=null&&mine<L.cash?'Best entry needs '+(L.cash-mine).toFixed(2)+' more to cash. ':'')+(L.t1!=null&&mine<L.t1?'Best entry is '+(L.t1-mine).toFixed(2)+' off the top 1%.':'')+'</div>';
 return h;
}
function expTable(c,ks,cnt,n,title,zks){
 if(!ks.length&&!(zks&&zks.length))return "";
 var rowf=function(k){var cp=k.indexOf("CPT:")===0,nm=k.replace("CPT:",""),f=infoOf(c,k),mine=100*(cnt[k]||0)/n,o=c.own[k],fo=o?o[0]:0;
  var sub=[f.pos+(f.tm?" "+f.tm:""),f.sal!=null?"$"+n0(f.sal):"",f.proj!=null?"proj "+f.proj:"",f.pown!=null?"proj own "+f.pown+"%":"",o&&o[1]!=null?o[1]+" pts now":""].filter(function(z){return z}).join(" &middot; ");
  return xrow(esc(nm)+(cp?' <span class="c">CPT</span>':""),sub,mine,fo,"")};
 return '<h3>'+title+'</h3>'+ks.slice(0,40).map(rowf).join("")+(ks.length>40?'<div class="note">Top 40 of '+ks.length+' players.</div>':"")+
  (zks&&zks.length?'<div class="note" style="margin:8px 0 2px"><b>Not on his lineups</b> (field owns 5%+, he has 0)</div>'+zks.slice(0,10).map(rowf).join(""):"");
}
function zeroKeys(c,cnt,wantCpt){   // field favourites (standings %Drafted >= 5) that appear in none of his visible lineups
 return Object.keys(c.own||{}).filter(function(k){var o=c.own[k];return o&&o[0]>=5&&!cnt[k]&&!/(^|:)LOCKED$/.test(k)&&(wantCpt===undefined||(k.indexOf("CPT:")===0)===wantCpt)}).sort(function(a,b){return c.own[b][0]-c.own[a][0]});
}
function sdCombos(c,lus){
 var N=lus.length||1,cp={},cf={},ff={},dup={};
 function add(o,k){o[k]=(o[k]||0)+1}
 lus.forEach(function(lu){var vis=lu.filter(function(p){return !hid(p)});if(!vis.length)return;var cap=hid(lu[0])?null:lu[0],fl=lu.slice(1).filter(function(p){return !hid(p)}).sort();
  if(cap){add(cp,cap);fl.forEach(function(f){add(cf,cap+" + "+f)})}
  for(var i=0;i<fl.length;i++)for(var j=i+1;j<fl.length;j++)add(ff,fl[i]+" + "+fl[j]);
  if(cap&&lu.length>1&&fl.length===lu.length-1)add(dup,cap+" | "+fl.join(", "))});
 function tbl(o,h1,top,minn){var ks=Object.keys(o).filter(function(k){return o[k]>=(minn||1)}).sort(function(a,b){return o[b]-o[a]});if(!ks.length)return '<div class="note">none</div>';return '<div class="tw"><table><thead><tr><th>'+h1+'</th><th>Lineups</th><th>%</th></tr></thead><tbody>'+ks.slice(0,top).map(function(k){return '<tr><td class="n">'+esc(k)+'</td><td>'+o[k]+'</td><td>'+(100*o[k]/N).toFixed(1)+'</td></tr>'}).join("")+'</tbody></table></div>'}
 return '<h2 style="margin-top:12px">Captain + flex pairs</h2>'+tbl(cf,"CPT + FLEX",25)+'<h2 style="margin-top:12px">Flex + flex pairs</h2>'+tbl(ff,"FLEX + FLEX",25)+'<h2 style="margin-top:12px">His duplicate lineups</h2><div class="note" style="margin:0 0 6px">Same captain and same flex set, any order (only fully visible lineups).</div>'+tbl(dup,"Lineup",20,2);
}
function todayBody(c,all){
 var cnt={},hidn=0,n=0,lus=all.map(function(x){return x.e[3]}),sd=c.gt==="showdown";
 all.forEach(function(x){n++;x.e[3].forEach(function(p,i){if(hid(p)){hidn++;return}var k=(sd&&i===0?"CPT:":"")+p;cnt[k]=(cnt[k]||0)+1})});
 var ks=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]});
 var h='<div class="note" style="margin:0 0 8px"><a href="https://www.draftkings.com/contest/gamecenter/'+esc(c.id)+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:600">Open on DraftKings &#8599;</a> · '+esc(c.group)+' · prize pool '+(c.prize?money(c.prize):"?")+' · locked '+esc(c.lock)+' UTC'+(hidn?' · '+hidn+' lineup slots still hidden by DK (games not started)':'')+'</div>';
 h+=linesBlock(c,all);
 h+='<div class="note" style="margin:0 0 6px">Pos, salary, projection and projected ownership come from the slate input sheet'+(sd?' (captain rows use the captain salary, 1.5x projection and captain ownership)':'')+'. Field % is DK\'s live %Drafted. Lev = his minus field.</div>';
 if(sd){var cks=ks.filter(function(k){return k.indexOf("CPT:")===0}),fks=ks.filter(function(k){return k.indexOf("CPT:")!==0});
  h+=expTable(c,cks,cnt,n,"Captain exposure vs this contest",zeroKeys(c,cnt,true))+expTable(c,fks,cnt,n,"Flex exposure vs this contest",zeroKeys(c,cnt,false))+det("Team, game and pairs",rollups(c,lus,true)+sdCombos(c,lus),false)}
 else h+=expTable(c,ks,cnt,n,"Exposure vs this contest",zeroKeys(c,cnt))+det("Team, game and QB stacks",rollups(c,lus,false),false);
 h+='<details open><summary>Entries ('+all.length+')</summary><div class="tw"><table><thead><tr><th>Rank</th><th>User</th><th>Pts</th><th>Prize now</th><th>To cash</th><th>Time left</th><th style="text-align:left">Lineup</th></tr></thead><tbody>'+all.slice().sort(function(a,b){return a.e[0]-b.e[0]}).slice(0,300).map(function(x){return '<tr><td>'+n0(x.e[0])+'</td><td class="n">'+esc(x.u)+'</td><td>'+x.e[1]+'</td><td>'+(function(){var z=prizeAt(c.lines,x.e[0]);return z>0?'<span class="pos">'+money(z)+'</span>':'-'})()+'</td><td>'+(function(){var L=c.lines;if(!L||L.cash==null)return '-';var g=L.cash-x.e[1];return g<=0?'<span class="pos">in</span>':g.toFixed(1)})()+'</td><td>'+(x.e[2]==null?"-":x.e[2])+'</td><td class="lu">'+x.e[3].map(function(p,i){if(hid(p))return '<span class="mute">hidden</span>';var cp=sd&&i===0,f=infoOf(c,(cp?"CPT:":"")+p);return (cp?'<span class="c">CPT</span>':"")+esc(p)+(f.tm?' <span class="mute">'+esc(f.pos)+' '+esc(f.tm)+'</span>':"")}).join(" · ")+'</td></tr>'}).join("")+'</tbody></table></div></details>';
 return h;
}
function loadToday(){fetch("today.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){T=d;fresh();if(VIEW==="today")renderToday()}).catch(function(){if(VIEW==="today")renderToday()})}
function setView(v){VIEW=v;document.querySelectorAll("#views button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-v")===v)});$("today").hidden=v!=="today";$("hist").hidden=v!=="hist";$("sports").hidden=v!=="hist";if(v==="today"){tabs();renderToday()}else{render()}fresh()}
document.addEventListener("click",function(ev){
 var vb=ev.target.closest&&ev.target.closest("#views button");if(vb){setView(vb.getAttribute("data-v"));return}
 var fb=ev.target.closest&&ev.target.closest("button[data-cf]");if(fb){CF=fb.getAttribute("data-cf");renderToday();return}
 var hd=ev.target.closest&&ev.target.closest("#today .hd");if(!hd)return;var k=hd.parentNode.getAttribute("data-tk");TOPEN[k]=!TOPEN[k];renderToday()
});
setInterval(function(){if(VIEW==="today"&&!document.hidden)loadToday()},60000);

fetch("data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
 D=d;$("sub").textContent="Private page · history: final standings from the GTS contest database, built "+d.built;setView("today");loadToday();
}).catch(function(e){$("sub").textContent="Could not load data ("+e.message+")"});
</script></body></html>
